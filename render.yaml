services:
  - type: web
    name: hey-min
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hey-min-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: hey-min-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: APP_NAME
        value: "Hey MIN"
      - key: APP_ENV
        value: production
      - key: ENABLE_2FA
        value: "true"
      - key: ENABLE_VOICE_CALLS
        value: "true"
      - key: ENABLE_VIDEO_CALLS
        value: "true"
      - key: ENABLE_GROUP_CHAT
        value: "true"
      - key: ENABLE_MESSAGE_REACTIONS
        value: "true"
      - key: ENABLE_MESSAGE_EDIT
        value: "true"
      - key: ENABLE_TYPING_INDICATOR
        value: "true"
      - key: ENABLE_READ_RECEIPTS
        value: "true"
      - key: ENABLE_FILE_SHARING
        value: "true"
      - key: ENABLE_STORIES
        value: "true"
      - key: ENABLE_AI_ASSISTANT
        value: "true"
      - key: ENABLE_BLOCK_USERS
        value: "true"
      - key: ENABLE_DARK_MODE
        value: "true"
      - key: MAX_FILE_SIZE
        value: "20971520"
      - key: RATE_LIMIT_MESSAGES
        value: "50"
      - key: RATE_LIMIT_WINDOW
        value: "60"
      - key: OPENAI_API_KEY
        sync: false

  - type: redis
    name: hey-min-redis
    plan: free
    ipAllowList: []  # ← এই লাইনটা যোগ করো! সব IP থেকে access দেবে

databases:
  - name: hey-min-db
    plan: free
    databaseName: heymin_db
    user: heymin_admin
    ipAllowList: []  # ← ডাটাবেসের জন্যও যোগ করো
