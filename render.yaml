services:
  # =========================
  # MAIN WEB SERVER
  # =========================
  - type: web
    name: hey-min-web
    runtime: python
    repo: https://github.com/YOUR_USERNAME/hey-min
    plan: professional

    buildCommand: |
      pip install -r requirements.txt
      python -m playwright install chromium

    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 4

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hey-min-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: redis
          name: hey-min-redis
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: JWT_SECRET
        generateValue: true

      - key: WEBHOOK_SECRET
        generateValue: true

      - key: APP_ENV
        value: production

      - key: APP_NAME
        value: "Hey MIN"

      - key: DEBUG
        value: "false"

      - key: CORS_ORIGINS
        value: "https://hey-min.onrender.com,https://www.heymin.com"

      - key: MAX_FILE_SIZE
        value: "10485760"

      - key: RATE_LIMIT_MESSAGES
        value: "30"

      - key: RATE_LIMIT_WINDOW
        value: "60"

      - key: ENABLE_2FA
        value: "true"

      - key: ENABLE_VOICE_CALLS
        value: "true"

      - key: ENABLE_VIDEO_CALLS
        value: "true"

      - key: ENABLE_AI_ASSISTANT
        value: "true"

      - key: ENABLE_FILE_SHARING
        value: "true"

      - key: ENABLE_GROUP_CHAT
        value: "true"

      - key: ENABLE_STORIES
        value: "true"

      - key: ENABLE_POLLS
        value: "true"

      - key: OPENAI_API_KEY
        sync: false

      - key: SENDGRID_API_KEY
        sync: false

      - key: STRIPE_API_KEY
        sync: false

      - key: AWS_ACCESS_KEY
        sync: false

      - key: AWS_SECRET_KEY
        sync: false

      - key: AWS_BUCKET_NAME
        value: "hey-min-uploads"

      - key: SENTRY_DSN
        sync: false

      - key: FIREBASE_CREDENTIALS
        sync: false


  # =========================
  # CELERY WORKER
  # =========================
  - type: worker
    name: hey-min-worker
    runtime: python
    plan: professional

    buildCommand: pip install -r requirements.txt

    startCommand: celery -A backend.tasks worker --loglevel=info --concurrency=4

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hey-min-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: redis
          name: hey-min-redis
          property: connectionString

      - key: APP_ENV
        value: production


  # =========================
  # REDIS
  # =========================
  - type: redis
    name: hey-min-redis
    plan: professional
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []


  # =========================
  # CRON JOB
  # =========================
  - type: cron
    name: hey-min-cron

    schedule: "0 0 * * *"

    runtime: python

    buildCommand: pip install -r requirements.txt

    startCommand: python -m backend.cron_jobs

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hey-min-db
          property: connectionString

      - key: APP_ENV
        value: production


  # =========================
  # STATIC CDN
  # =========================
  - type: static_site
    name: hey-min-cdn

    buildCommand: echo "Static site ready"

    publishPath: ./static

    headers:
      - path: /*
        name: Cache-Control
        value: max-age=31536000


# =========================
# DATABASES
# =========================
databases:
  - name: hey-min-db

    plan: professional

    databaseName: heymin_db

    user: heymin_admin

    postgresMajorVersion: 15

    ipAllowList: []

    diskSizeGB: 10
